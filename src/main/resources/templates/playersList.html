<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Add Player to Team</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, td, th {
            border: 1px solid black;
            padding: 10px;
        }
        section {
            float: left;
            margin: 0 1.5%;
            width: 63%;
        }
        aside {
            float: right;
            margin: 0 1.5%;
            width: 30%;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<header>
    <h1>Select the Player to add to the Team</h1>
</header>
<!-- Display the errorMessage here (only if it exists), using the "error" class -->
<section>
    <h2>Select player:</h2>
    <form action="/teamDetails" method="POST">
        <!-- Hidden field with the selected teamId -->
        <!-- Dynamically display radio buttons for each player,
             the value should be the playerId
             and the displayed text should be:
             <firstName> <lastName> (#<jerseyNumber>, <position>) -->
        <input type="radio" name="playerId" value="P1"> Marko Ilievski (#10, Midfielder) <br/>
        <input type="radio" name="playerId" value="P2"> Stefan Trajkov (#1, Goalkeeper) <br/>
        <input type="radio" name="playerId" value="P3"> Ana Petreska (#9, Forward) <br/>
        <br/>
        <input type="submit" value="Add player">
    </form>
</section>
<aside>
    <table>
        <tr>
            <td><b>Team ID</b></td>
            <td><!-- Display selected teamId --></td>
        </tr>
        <tr>
            <td><b>Team Name</b></td>
            <td><!-- Display team name --></td>
        </tr>
        <tr>
            <td><b>City</b></td>
            <td><!-- Display team city --></td>
        </tr>
    </table>
</aside>
</body>
</html>
